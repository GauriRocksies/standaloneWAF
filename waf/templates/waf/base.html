{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WAF Dashboard{% endblock %} · VulneraBlog</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0f1c;
            --panel: #101a2e;
            --panel-alt: #0d1526;
            --border: #1e2d47;
            --text: #e7edf5;
            --text-muted: #8ba3c0;
            --teal: #16c9b0;
            --teal-dim: rgba(22, 201, 176, 0.14);
            --sev-low: #2ecc71;
            --sev-medium: #f1c40f;
            --sev-high: #e67e22;
            --sev-critical: #e74c3c;
            --radius: 10px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--panel-alt);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar .brand {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--teal);
            margin: 0 8px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar .brand::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 8px var(--teal);
        }

        .sidebar a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13.5px;
            padding: 10px 12px;
            border-radius: var(--radius);
            transition: background 0.15s, color 0.15s;
        }

        .sidebar a:hover {
            background: var(--panel);
            color: var(--text);
        }

        .sidebar a.active {
            background: var(--teal-dim);
            color: var(--teal);
            font-weight: 600;
        }

        .sidebar .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 16px 8px;
        }

        /* --- Main content --- */
        main {
            flex: 1;
            padding: 32px 40px;
            max-width: 1280px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 700;
        }

        .page-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13.5px;
        }

        /* --- Cards --- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
        }

        .card .label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .card.accent .value { color: var(--teal); }
        .card.danger .value { color: var(--sev-critical); }
        .card.warn .value { color: var(--sev-high); }

        /* --- Panels (charts, tables) --- */
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-grid .panel { margin-bottom: 0; }

        @media (max-width: 900px) {
            .chart-grid { grid-template-columns: 1fr; }
        }

        canvas { max-height: 260px; }

        /* --- Tables --- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.03em;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        .mono {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 12.5px;
        }

        .url-cell {
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- Badges --- */
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .badge-low { background: rgba(46, 204, 113, 0.15); color: var(--sev-low); }
        .badge-medium { background: rgba(241, 196, 15, 0.15); color: var(--sev-medium); }
        .badge-high { background: rgba(230, 126, 34, 0.15); color: var(--sev-high); }
        .badge-critical { background: rgba(231, 76, 60, 0.15); color: var(--sev-critical); }

        .badge-blocked { background: rgba(231, 76, 60, 0.15); color: var(--sev-critical); }
        .badge-allowed { background: rgba(139, 163, 192, 0.15); color: var(--text-muted); }

        .empty-state {
            color: var(--text-muted);
            font-size: 13px;
            padding: 24px 0;
            text-align: center;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="sidebar">
        <div class="brand">WAF Console</div>
        <a href="{% url 'waf:dashboard' %}" class="{% if active_nav == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'waf:blocked_ips' %}" class="{% if active_nav == 'blocked_ips' %}active{% endif %}">Blocked IPs</a>
        <a href="{% url 'waf:statistics' %}" class="{% if active_nav == 'statistics' %}active{% endif %}">Statistics</a>
        <hr class="divider">
        <a href="/admin/waf/">Django Admin</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
