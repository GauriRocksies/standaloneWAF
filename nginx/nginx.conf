worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream waf_verdict_service {
        server 127.0.0.1:9000;
    }

    upstream waf_verdict_service_flask {
        server 127.0.0.1:9001;
    }

    # =========================
    # Django + WAF
    # =========================
    server {
        listen 8080;
        server_name _;

        client_max_body_size 10m;

        location / {
            proxy_pass http://waf_verdict_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 502 503 504 = @waf_unavailable;
        }

        location @waf_unavailable {
            default_type text/plain;
            return 503 "WAF verdict service unavailable. Request blocked (fail-closed).";
        }
    }

    # =========================
    # Flask + WAF
    # =========================
    server {
        listen 8081;
        server_name _;

        client_max_body_size 10m;

        location / {
            proxy_pass http://waf_verdict_service_flask;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 502 503 504 = @waf_flask_unavailable;
        }

        location @waf_flask_unavailable {
            default_type text/plain;
            return 503 "Flask WAF verdict service unavailable. Request blocked (fail-closed).";
        }
    }
}