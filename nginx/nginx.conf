# nginx/nginx.conf
#
# Client entry point for the protected site. Nginx never talks to the
# origin directly — every request goes to the FastAPI WAF verdict
# service (waf_proxy.verdict_service), which inspects the request via
# the existing WAF core and, on ALLOW, forwards it to whatever origin
# is configured in waf_proxy's own environment (UPSTREAM_HOST/PORT).
#
# If the WAF service itself is unreachable, Nginx returns 503 rather
# than falling back to the origin — the security inspection service
# being down must never mean "let everything through".

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream waf_verdict_service {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080;
        server_name _;

        # Allow reasonably large bodies through to the WAF for
        # inspection (payload_validator.py checks CONTENT_LENGTH).
        client_max_body_size 10m;

        location / {
            proxy_pass http://waf_verdict_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If the WAF verdict service is down, fail closed with 503
            # instead of nginx's default 502 passthrough behavior.
            proxy_intercept_errors on;
            error_page 502 503 504 = @waf_unavailable;
        }

        location @waf_unavailable {
            default_type text/plain;
            return 503 "WAF verdict service unavailable. Request blocked (fail-closed).";
        }
    }
}